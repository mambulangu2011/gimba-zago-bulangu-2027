<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HON. GIMBA ZAGO 2027</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:sans-serif}
.active{background:#0f766e!important;color:#fff!important}
.custom-select{position:relative}
.custom-select-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:2px solid #059669;border-radius:12px;max-height:240px;overflow:auto;z-index:60;display:none;box-shadow:0 10px 20px rgba(0,0,0,.2)}
.custom-select-list.open{display:block}
.custom-option{padding:12px 16px;font-size:13px;font-weight:700;cursor:pointer;border-bottom:1px solid #f1f5f9}
.drawer{transform:translateX(-100%);transition:transform 0.3s ease}
.drawer.open{transform:translateX(0)}
.overlay{display:none}
.overlay.open{display:block}
</style>
</head>
<body class="bg-slate-50">
<header class="bg-emerald-800 text-white p-3 sticky top-0 z-40 shadow-lg">
<div class="max-w-6xl mx-auto flex justify-between items-center">
<div class="flex gap-3 items-center">
<button onclick="toggleDrawer()" class="bg-white/20 w-10 h-10 rounded-full flex items-center justify-center text-xl font-black">☰</button>
<div class="w-10 h-10 bg-white text-emerald-800 rounded-full flex items-center justify-center font-black text-sm">GZ</div>
<div class="leading-tight">
<h1 class="font-black text-[17px] leading-none">HON. GIMBA ZAGO</h1>
<p class="text-[9px] font-bold mt-1 opacity-90">BULANGU CONSTITUENCY - HOUSE OF ASSEMBLY 2027 - APC</p>
</div>
</div>
</div>
<div class="max-w-6xl mx-auto mt-3 flex gap-2 text-[10px] font-bold overflow-auto">
<div class="bg-white/20 px-3 py-1 rounded-full whitespace-nowrap">🟢 Magoya Baya: <span id="liveCount">0</span></div>
<div class="bg-white/20 px-3 py-1 rounded-full whitespace-nowrap">💬 Muryoyi: <span id="liveVoices">0</span></div>
<div class="bg-white/20 px-3 py-1 rounded-full whitespace-nowrap">💭 Chat: <span id="liveChat">0</span></div>
</div>
</header>
<div id="overlay" class="overlay fixed inset-0 bg-black/50 z-50" onclick="toggleDrawer()"></div>
<div id="drawer" class="drawer fixed top-0 left-0 w-[82%] max-w-[320px] h-full bg-white z-[60] shadow-2xl overflow-auto">
<div class="bg-emerald-800 text-white p-4">
<div class="flex justify-between items-center">
<div class="flex gap-3 items-center"><div class="w-10 h-10 bg-white text-emerald-800 rounded-full flex items-center justify-center font-black">GZ</div><div><p class="font-black text-sm">HON. GIMBA ZAGO</p><p class="text-[9px]">BULANGU 2027 - APC</p></div></div>
<button onclick="toggleDrawer()" class="bg-white/20 w-8 h-8 rounded-full">✕</button>
</div>
<div class="mt-4 grid grid-cols-3 gap-2">
<button onclick="openLogin(); toggleDrawer()" class="bg-white text-emerald-800 py-2 rounded-xl text-xs font-black">🔐 Login</button>
<button onclick="speakHausaSlow()" class="bg-white/20 py-2 rounded-xl text-xs font-bold">🔊 Hausa</button>
<button onclick="stopSpeaking()" class="bg-red-500 py-2 rounded-xl text-xs font-bold">⏹️ Tsaya</button>
</div>
</div>
<div class="p-4">
<p class="text-[10px] font-black text-slate-400 tracking-widest mb-3">MENU - Danna don budewa</p>
<div id="menuList" class="space-y-2"></div>
<input id="searchWards" oninput="filterWards()" placeholder="🔍 Nema Ward - Zago, Bulangu..." class="w-full mt-4 p-3 border-2 border-emerald-100 rounded-xl text-sm outline-none">
<div class="mt-6 p-3 bg-slate-900 text-white rounded-xl text-center">
<p class="text-[9px] opacity-60">FOUNDER</p><p class="font-black text-sm">MAM BULANGU</p><p class="text-[10px] opacity-70">Bulangu, Kafin Hausa LGA</p>
</div>
</div>
</div>
<div class="max-w-6xl mx-auto p-3">
<div class="bg-emerald-50 border border-emerald-100 rounded-2xl p-4 mb-4">
<h2 id="mTitle" class="font-black text-lg"></h2>
<p id="mText" class="text-sm text-slate-600 mt-1"></p>
<div class="mt-3 flex gap-2">
<button onclick="speakHausaSlow()" class="bg-emerald-700 text-white px-4 py-2 rounded-full text-xs font-bold">🔊 Ji da Hausa - A hankali</button>
<button onclick="stopSpeaking()" class="bg-red-600 text-white px-4 py-2 rounded-full text-xs font-bold">⏹️ Tsaya</button>
</div>
</div>
<div class="bg-white rounded-2xl p-4 border shadow-sm">
<div id="detail"></div>
<div class="mt-6 flex gap-2">
<button onclick="prev()" class="flex-1 bg-slate-100 py-3 rounded-xl font-bold text-sm">⬅️ Baya</button>
<button onclick="next()" class="flex-1 bg-slate-900 text-white py-3 rounded-xl font-bold text-sm">Gaba ➡️</button>
</div>
</div>
<div id="cardBox" class="hidden mt-4 bg-emerald-800 text-white rounded-2xl p-4"><div id="cardData" class="bg-white/10 p-3 rounded-xl text-sm"></div></div>
</div>
<div id="loginModal" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-6 w-full max-w-sm"><h3 class="font-black">🔐 Login - HON. GIMBA ZAGO</h3><input id="loginUser" placeholder="Admin" class="w-full mt-4 p-3 border-2 rounded-xl text-sm"><input id="loginPass" type="password" placeholder="1234" class="w-full mt-3 p-3 border-2 rounded-xl text-sm"><button onclick="doLogin()" class="w-full mt-4 bg-emerald-700 text-white py-3 rounded-xl font-black">Shiga</button><button onclick="closeLogin()" class="w-full mt-2 bg-slate-100 py-2.5 rounded-xl text-sm font-bold">Rufe</button><p class="text-[10px] text-center mt-3 text-slate-400">Admin / 1234</p></div></div>
<script>
const bulanguWards=[{ward:"Bulangu",desc:"Hedikwatar"},{ward:"Jabo",desc:"Jabo"},{ward:"Zago",desc:"Zago - Gidan GZ"},{ward:"Sarawa",desc:"Sarawa"},{ward:"Majawa",desc:"Majawa"},{ward:"Ruba",desc:"Ruba"},{ward:"Kazalewa",desc:"Kazalewa"},{ward:"Gafaya",desc:"Gafaya"},{ward:"Mezan",desc:"Mezan"},{ward:"Dumadumin Toka",desc:"Dumadumin Toka"},{ward:"Kafin Hausa",desc:"Kafin Hausa"}];
let selectedChatWard=""; let isSpeaking=false; let current=0; let drawerOpen=false;
function toggleDrawer(){ drawerOpen=!drawerOpen; document.getElementById('drawer').classList.toggle('open',drawerOpen); document.getElementById('overlay').classList.toggle('open',drawerOpen); }
function stopSpeaking(){ window.speechSynthesis.cancel(); isSpeaking=false; }
function speakHausaSlow(){
  if(window.speechSynthesis.speaking){ window.speechSynthesis.cancel(); isSpeaking=false; return; }
  const m=menus[current];
  const t=`${m.mTitle}. ${m.mText}. Wannan app din Hon. Gimba Zago ne. Bulangu. Dan Bulangu ne. Ku zabi Ward. Ku yi magana da Hausa. A hankali.`;
  const u=new SpeechSynthesisUtterance(t);
  u.lang='ha-NG'; u.rate=0.5; u.pitch=0.9;
  u.onstart=()=>{ isSpeaking=true; }; u.onend=()=>{ isSpeaking=false; }; u.onerror=()=>{ isSpeaking=false; };
  function speakNow(){ const voices=window.speechSynthesis.getVoices(); let v=voices.find(x=>x.lang.toLowerCase().includes('ha')) || voices[0]; if(v) u.voice=v; window.speechSynthesis.speak(u); }
  if(window.speechSynthesis.getVoices().length===0){ window.speechSynthesis.onvoiceschanged=speakNow; } else { speakNow(); }
}
function toggleCustomSelect(id){ document.querySelectorAll('.custom-select-list').forEach(e=>{ if(e.id!==id) e.classList.remove('open'); }); document.getElementById(id).classList.toggle('open'); }
function buildChatWardSelect(){
  const c=document.getElementById('chatWardCustom'); if(!c) return;
  c.innerHTML=`<div class="custom-select"><div onclick="toggleCustomSelect('chatWardList')" class="w-full p-4 bg-white border-2 border-emerald-600 rounded-xl text-sm font-bold flex justify-between cursor-pointer"><span id="chatWardDisplayText">👉 Danna nan - Zabi Ward - Zago, Bulangu...</span><span>▼</span></div><div id="chatWardList" class="custom-select-list">${bulanguWards.map(w=>`<div class="custom-option" onclick="chooseChatWard('${w.ward}')">${w.ward}</div>`).join('')}</div></div><input type="hidden" id="chatWardHidden">`;
}
function chooseChatWard(w){ selectedChatWard=w; document.getElementById('chatWardDisplayText').innerText=w+' Ward - Zababbe ✓'; document.getElementById('chatWardHidden').value=w; document.getElementById('chatWardList').classList.remove('open'); renderChats(); }
function buildLgaCustomSelect(){
  const c=document.getElementById('lgaCustom'); if(!c) return;
  c.innerHTML=`<div class="custom-select"><div onclick="toggleCustomSelect('lgaList')" class="w-full p-4 bg-white border-2 border-emerald-600 rounded-xl text-sm font-bold flex justify-between cursor-pointer"><span id="lgaDisplayText">👉 Danna nan - Zabi Ward</span><span>▼</span></div><div id="lgaList" class="custom-select-list">${bulanguWards.map(w=>`<div class="custom-option" onclick="chooseLgaWard('${w.ward}')">${w.ward}</div>`).join('')}</div></div>`;
}
function chooseLgaWard(w){ document.getElementById('lgaDisplayText').innerText=w+' Ward'; document.getElementById('lgaHidden').value=w; document.getElementById('wardSelectContainer').innerHTML=`<div class="p-3 bg-emerald-50 border-2 rounded-xl font-bold text-sm">${w} - Tabbatar ✓</div>`; document.getElementById('wardHidden').value=w; }
function buildRegisterWardSelect(){
  const c=document.getElementById('sWardCustom'); if(!c) return;
  c.innerHTML=`<div class="custom-select"><div onclick="toggleCustomSelect('sWardList')" class="w-full p-4 bg-white border-2 border-emerald-600 rounded-xl text-sm font-bold flex justify-between cursor-pointer"><span id="sWardDisplayText">👉 Danna nan - Zabi Ward - 11 Wards</span><span>▼</span></div><div id="sWardList" class="custom-select-list">${bulanguWards.map(w=>`<div class="custom-option" onclick="chooseSWard('${w.ward}')">${w.ward}</div>`).join('')}</div></div><input type="hidden" id="sWardHidden">`;
}
function chooseSWard(w){ document.getElementById('sWardDisplayText').innerText=w+' Ward'; document.getElementById('sWardHidden').value=w; document.getElementById('sWardList').classList.remove('open'); }
const menus=[
{title:"1. Tarihin GZ",mTitle:"Waye Hon. Gimba Zago?",mText:"Dan asalin Zago, Bulangu - APC 2027",content:`<h3 class="font-black text-xl">HON. GIMBA ZAGO</h3><p class="text-sm font-bold text-emerald-700">APC - BULANGU 2027</p><p class="text-sm mt-2">Dan Zago - Bulangu - 11 Wards</p>`},
{title:"2. Chat Bulangu 💬",mTitle:"Chat Room - LIVE",mText:"Zabi Ward - Yi chat - Da Hausa",content:`<div><label class="text-xs font-black text-emerald-700 mb-2 block">ZABI WARD - Danna don jerin:</label><div id="chatWardCustom"></div><div id="chatBox" class="h-[320px] overflow-auto bg-slate-50 rounded-2xl p-3 space-y-2 border-2 mt-3"></div><div class="flex gap-2 mt-3"><input id="chatName" placeholder="Sunanka" class="w-1/3 p-3 border-2 rounded-xl text-sm"><input id="chatMsg" placeholder="Rubuta da Hausa..." class="flex-1 p-3 border-2 rounded-xl text-sm"><button onclick="sendChat()" class="bg-emerald-700 text-white px-5 py-3 rounded-xl font-black text-sm">Tura</button></div></div>`},
{title:"3. Muryar Bulangu 🎙️",mTitle:"Muryar Bulangu - Rubuta Muryar",mText:"Rubuta bukatar ka da Hausa - Ba magana da murya - Rubutu kawai",content:`<div><label class="text-xs font-black text-emerald-700 mb-2 block">ZABI WARD - Danna:</label><div id="lgaCustom"></div><div id="wardSelectContainer" class="mt-3"></div><input type="hidden" id="lgaHidden"><input type="hidden" id="wardHidden"><textarea id="voiceText" class="w-full mt-4 p-4 border-2 border-slate-200 rounded-2xl text-sm" rows="4" placeholder="Mu a Zago muna bukatar hanyar Zago - Bulangu..."></textarea><button onclick="submitVoice()" class="w-full mt-3 bg-emerald-700 text-white py-3 rounded-xl font-black">Tura Muryar Zuwa GZ</button><div id="voiceList" class="mt-4 space-y-2"></div></div>`},
{title:"4. Duk Wards 🔍",mTitle:"Duk Wards 11 - Bulangu",mText:"Nema Ward - Danna Chat",content:`<div><input id="wardSearchInner" oninput="filterWardsInner()" placeholder="🔍 Nema Ward..." class="w-full p-3 border-2 border-emerald-100 rounded-xl text-sm mb-3"><div id="wardsGrid" class="grid gap-2"></div></div>`},
{title:"5. Register ✅",mTitle:"Yi Register - HON. GIMBA ZAGO",mText:"Zama magoyin baya",content:`<div class="space-y-3"><label class="text-xs font-black text-emerald-700">ZABI WARD - Danna:</label><div id="sWardCustom"></div><input id="sName" placeholder="Cikakken Suna" class="w-full p-3 border-2 rounded-xl text-sm"><input id="sPhone" placeholder="WhatsApp" class="w-full p-3 border-2 rounded-xl text-sm"><button onclick="register()" class="w-full bg-emerald-700 text-white py-3 rounded-xl font-black">✅ Yi Register - GZ</button></div>`},
{title:"6. Manifesto",mTitle:"Me GZ zai yi? 2027",mText:"Manifesto 5",content:`<h3 class="font-black text-lg">Manifesto 5</h3><div class="mt-3 space-y-2 text-sm"><div class="p-3 bg-emerald-50 rounded-xl"><b>1. Ilimi:</b> Makarantu 15</div><div class="p-3 bg-blue-50 rounded-xl"><b>2. Ruwa:</b> Rijiyoyi 30</div><div class="p-3 bg-amber-50 rounded-xl"><b>3. Hanyoyi:</b> Zago-Bulangu</div><div class="p-3 bg-purple-50 rounded-xl"><b>4. Matasa:</b> Aiki 200</div><div class="p-3 bg-rose-50 rounded-xl"><b>5. Lafiya:</b> Asibiti</div></div>`},
{title:"7. Yada App 📤",mTitle:"Yada App - HON. GIMBA ZAGO",mText:"Yada a Bulangu",content:`<div class="text-center"><button onclick="shareApp()" class="w-full bg-emerald-700 text-white py-3 rounded-xl font-black">📤 Yada - GZ</button><p class="text-xs mt-3 bg-slate-100 p-2 rounded-xl break-all">gimba-zago-bulangu-2027.onrender.com</p><p class="text-[10px] mt-2">Founder: Mam Bulangu</p></div>`}
];
let localSupporters=JSON.parse(localStorage.getItem('gz_v5_supporters')||'[]'); let localVoices=JSON.parse(localStorage.getItem('gz_v5_voices')||'[]');
function renderMenu(){ document.getElementById('menuList').innerHTML=menus.map((m,i)=>`<button onclick="selectMenu(${i}); toggleDrawer()" class="w-full text-left px-4 py-3 rounded-xl text-[13px] font-bold ${i===current?'active shadow':'bg-slate-50 border'}">${m.title}</button>`).join(''); }
function selectMenu(i){ current=i; stopSpeaking(); renderMenu(); document.getElementById('mTitle').innerText=menus[i].mTitle; document.getElementById('mText').innerText=menus[i].mText; document.getElementById('detail').innerHTML=menus[i].content; setTimeout(()=>{ if(i===1){ buildChatWardSelect(); renderChats(); } if(i===2){ buildLgaCustomSelect(); renderVoices(); } if(i===3){ renderWardsGrid(bulanguWards); } if(i===4){ buildRegisterWardSelect(); } },200); }
function next(){ if(current<menus.length-1) selectMenu(current+1); } function prev(){ if(current>0) selectMenu(current-1); }
function renderWardsGrid(list){ const g=document.getElementById('wardsGrid'); if(!g) return; g.innerHTML=list.map(w=>`<div class="p-3 bg-white border-2 rounded-xl flex justify-between items-center"><div><p class="font-black text-sm">${w.ward}</p></div><button onclick="selectWardFromGrid('${w.ward}')" class="text-xs bg-emerald-600 text-white px-3 py-1.5 rounded-full font-bold">Chat</button></div>`).join(''); }
function filterWards(){ const q=document.getElementById('searchWards').value.toLowerCase(); const f=bulanguWards.filter(w=>w.ward.toLowerCase().includes(q)); if(drawerOpen) toggleDrawer(); selectMenu(3); setTimeout(()=>renderWardsGrid(f),300); } function filterWardsInner(){ const q=document.getElementById('wardSearchInner').value.toLowerCase(); renderWardsGrid(bulanguWards.filter(w=>w.ward.toLowerCase().includes(q))); }
function selectWardFromGrid(w){ selectMenu(1); setTimeout(()=>{ chooseChatWard(w); },300); }
async function register(){ const ward=document.getElementById('sWardHidden')?.value||''; const name=document.getElementById('sName').value.trim(); const phone=document.getElementById('sPhone').value.trim(); if(!ward||!name){ alert('Danna jerin - Zabi Ward - Saka Suna'); return; } const data={name,ward,phone,createdAt:new Date().toISOString()}; localSupporters.push(data); localStorage.setItem('gz_v5_supporters',JSON.stringify(localSupporters)); document.getElementById('liveCount').innerText=localSupporters.length; document.getElementById('cardBox').classList.remove('hidden'); document.getElementById('cardData').innerHTML=`<p class="font-black">HON. GIMBA ZAGO</p><p>Suna: ${name}</p><p>Ward: ${ward}</p>`; alert('Register - '+ward); }
async function submitVoice(){ const txt=document.getElementById('voiceText').value.trim(); const ward=document.getElementById('wardHidden')?.value||'Bulangu'; if(!txt){ alert('Rubuta da Hausa'); return; } const data={text:txt,ward,date:new Date().toISOString()}; localVoices.push(data); localStorage.setItem('gz_v5_voices',JSON.stringify(localVoices)); document.getElementById('voiceText').value=''; renderVoices(); document.getElementById('liveVoices').innerText=localVoices.length; alert('Muryar ta je - '+ward); }
function renderVoices(){ const b=document.getElementById('voiceList'); if(!b) return; b.innerHTML=localVoices.slice(-6).reverse().map(v=>`<div class="p-3 bg-white border rounded-xl text-sm"><p>"${v.text}"</p><p class="text-[10px] text-slate-400 mt-1">${v.ward}</p></div>`).join('')||'<p class="text-xs text-slate-400 text-center py-4">Babu muryoyi - Rubuta yanzu</p>'; }
async function sendChat(){ const ward=document.getElementById('chatWardHidden')?.value||selectedChatWard; const name=document.getElementById('chatName').value.trim()||'Dan Bulangu'; const msg=document.getElementById('chatMsg').value.trim(); if(!ward||!msg){ alert('Zabi Ward - Danna jerin - Rubuta'); return; } let chats=JSON.parse(localStorage.getItem('gz_v5_chats')||'[]'); chats.push({ward,name,msg,createdAt:new Date().toISOString()}); localStorage.setItem('gz_v5_chats',JSON.stringify(chats)); document.getElementById('chatMsg').value=''; renderChats(); document.getElementById('liveChat').innerText=chats.length; }
function renderChats(){ const box=document.getElementById('chatBox'); if(!box) return; const ward=document.getElementById('chatWardHidden')?.value||selectedChatWard; let list=JSON.parse(localStorage.getItem('gz_v5_chats')||'[]'); if(ward) list=list.filter(c=>c.ward===ward); list=list.slice(-25); box.innerHTML=list.map(c=>`<div class="flex"><div class="p-2.5 bg-white border rounded-xl text-sm max-w-[85%] shadow-sm"><p class="font-black text-[10px] text-emerald-700">${c.name} - ${c.ward}</p><p class="mt-1">${c.msg}</p></div></div>`).join('')||`<p class="text-sm text-slate-400 text-center py-8">Babu sakonni a ${ward||'Ward'} - Ka fara chat!</p>`; box.scrollTop=box.scrollHeight; }
function shareApp(){ const url='https://gimba-zago-bulangu-2027.onrender.com'; if(navigator.share){ navigator.share({title:'HON. GIMBA ZAGO',url}); } else { navigator.clipboard.writeText(url); alert('Link an kwafa: '+url); } }
function openLogin(){ document.getElementById('loginModal').classList.remove('hidden'); } function closeLogin(){ document.getElementById('loginModal').classList.add('hidden'); }
function doLogin(){ const u=document.getElementById('loginUser').value; const p=document.getElementById('loginPass').value; if(u==='Admin'&&p==='1234'){ alert('Barka da zuwa Admin'); closeLogin(); } else if(u&&p){ alert('An shiga: '+u); closeLogin(); } else alert('Saka Username da Password'); }
renderMenu(); selectMenu(0);
</script>
</body>
</html>
