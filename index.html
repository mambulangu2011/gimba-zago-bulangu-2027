<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HON. GIMBA ZAGO 2027</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:sans-serif}
.active{background:#0f766e!important;color:#fff!important}
.custom-select{position:relative}
.custom-select-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:2px solid #059669;border-radius:12px;max-height:240px;overflow:auto;z-index:60;display:none;box-shadow:0 10px 20px rgba(0,0,0,.15)}
.custom-select-list.open{display:block}
.custom-option{padding:12px 16px;font-size:13px;font-weight:700;cursor:pointer;border-bottom:1px solid #f1f5f9}
.custom-option:hover{background:#ecfdf5}
</style>
</head>
<body class="bg-slate-50">
<header class="bg-emerald-800 text-white p-3 sticky top-0 z-50">
<div class="max-w-6xl mx-auto flex justify-between items-center">
<div class="flex gap-3 items-center"><div class="w-12 h-12 bg-white text-emerald-800 rounded-full flex items-center justify-center font-black">GZ</div><div><h1 class="font-black text-[18px]">HON. GIMBA ZAGO</h1><p class="text-[10px]">BULANGU CONSTITUENCY - 2027 - APC</p></div></div>
<div class="flex gap-2"><button onclick="openLogin()" class="bg-white text-emerald-800 px-4 py-2 rounded-full text-xs font-black">Login</button><button onclick="speakHausaSlow()" class="bg-white/20 px-3 py-2 rounded-full text-xs font-bold">Hausa</button></div>
</div>
<div class="max-w-6xl mx-auto mt-3 flex gap-2 text-[11px] font-bold"><div class="bg-white/20 px-3 py-1.5 rounded-full">Magoya Baya: <span id="liveCount">0</span></div><div class="bg-white/20 px-3 py-1.5 rounded-full">Muryoyi: <span id="liveVoices">0</span></div><div class="bg-white/20 px-3 py-1.5 rounded-full">Chat: <span id="liveChat">0</span></div></div>
</header>
<div class="max-w-6xl mx-auto grid md:grid-cols-3 gap-4 p-3">
<aside class="bg-white rounded-2xl p-4 h-fit md:sticky top-[95px] border"><div id="menuList" class="space-y-2"></div><input id="searchWards" oninput="filterWards()" placeholder="Nema Ward..." class="w-full mt-4 p-3 border-2 border-emerald-100 rounded-xl text-sm"></aside>
<main class="md:col-span-2"><div class="bg-emerald-50 border rounded-2xl p-5 mb-4"><h2 id="mTitle" class="font-black text-xl"></h2><p id="mText" class="text-sm text-slate-600 mt-2"></p><button onclick="speakHausaSlow()" class="mt-3 bg-emerald-700 text-white px-4 py-2 rounded-full text-xs font-bold">Ji da Hausa - A hankali</button></div><div class="bg-white rounded-2xl p-5 border min-h-[520px]"><div id="detail"></div><div class="mt-8 flex gap-2"><button onclick="prev()" class="flex-1 bg-slate-100 py-3 rounded-xl font-bold">Baya</button><button onclick="speakHausaSlow()" class="flex-1 bg-emerald-700 text-white py-3 rounded-xl font-bold">Hausa A Hankali</button><button onclick="next()" class="flex-1 bg-slate-900 text-white py-3 rounded-xl font-bold">Gaba</button></div></div><div id="cardBox" class="hidden mt-5 bg-emerald-800 text-white rounded-2xl p-5"><div id="cardData" class="mt-3 bg-white/10 p-4 rounded-xl text-sm"></div></div><div class="mt-8 p-5 bg-slate-900 text-white rounded-2xl text-center"><p class="font-black">MAM BULANGU</p><p class="text-[11px] opacity-70">Founder</p></div></main>
</div>
<div id="loginModal" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-6 w-full max-w-sm"><h3 class="font-black">Login - HON. GIMBA ZAGO</h3><input id="loginUser" placeholder="Admin" class="w-full mt-4 p-3 border-2 rounded-xl"><input id="loginPass" type="password" placeholder="1234" class="w-full mt-3 p-3 border-2 rounded-xl"><button onclick="doLogin()" class="w-full mt-4 bg-emerald-700 text-white py-3 rounded-xl font-black">Shiga</button><button onclick="closeLogin()" class="w-full mt-2 bg-slate-100 py-2.5 rounded-xl">Rufe</button></div></div>
<script>
const bulanguWards=[{ward:"Bulangu",desc:"Hedikwatar"},{ward:"Jabo",desc:"Jabo"},{ward:"Zago",desc:"Zago - Gidan GZ"},{ward:"Sarawa",desc:"Sarawa"},{ward:"Majawa",desc:"Majawa"},{ward:"Ruba",desc:"Ruba"},{ward:"Kazalewa",desc:"Kazalewa"},{ward:"Gafaya",desc:"Gafaya"},{ward:"Mezan",desc:"Mezan"},{ward:"Dumadumin Toka",desc:"Dumadumin Toka"},{ward:"Kafin Hausa",desc:"Kafin Hausa"}];
let selectedChatWard="";
function speakHausaSlow(){const m=menus[current];speechSynthesis.cancel();const t=`${m.mTitle}. ${m.mText}. Wannan app din Hon. Gimba Zago ne. Bulangu. Dan Bulangu. Ku zabi Ward. Ku yi magana da Hausa. A hankali. Ba da sauri ba.`;const u=new SpeechSynthesisUtterance(t);u.lang='ha-NG';u.rate=0.6;u.pitch=1.0;speechSynthesis.speak(u);}
function speakCurrent(){speakHausaSlow();}
function toggleCustomSelect(id){document.querySelectorAll('.custom-select-list').forEach(e=>{if(e.id!==id)e.classList.remove('open');});document.getElementById(id).classList.toggle('open');}
function buildChatWardSelect(){const c=document.getElementById('chatWardCustom');if(!c)return;c.innerHTML=`<div class="custom-select"><div onclick="toggleCustomSelect('chatWardList')" class="w-full p-4 bg-white border-2 border-emerald-600 rounded-xl text-sm font-bold flex justify-between cursor-pointer"><span id="chatWardDisplayText">Danna nan - Zabi Ward - Misali: Zago</span><span>▼</span></div><div id="chatWardList" class="custom-select-list">${bulanguWards.map(w=>`<div class="custom-option" onclick="chooseChatWard('${w.ward}')">${w.ward}</div>`).join('')}</div></div><input type="hidden" id="chatWardHidden">`;}
function chooseChatWard(w){selectedChatWard=w;document.getElementById('chatWardDisplayText').innerText=w+' Ward - Zababbe';document.getElementById('chatWardHidden').value=w;document.getElementById('chatWardList').classList.remove('open');renderChats();}
function buildLgaCustomSelect(){const c=document.getElementById('lgaCustom');if(!c)return;c.innerHTML=`<div class="custom-select"><div onclick="toggleCustomSelect('lgaList')" class="w-full p-4 bg-white border-2 border-emerald-600 rounded-xl text-sm font-bold flex justify-between cursor-pointer"><span id="lgaDisplayText">Danna nan - Zabi Ward</span><span>▼</span></div><div id="lgaList" class="custom-select-list">${bulanguWards.map(w=>`<div class="custom-option" onclick="chooseLgaWard('${w.ward}')">${w.ward}</div>`).join('')}</div></div>`;}
function chooseLgaWard(w){document.getElementById('lgaDisplayText').innerText=w+' Ward';document.getElementById('lgaHidden').value=w;document.getElementById('wardSelectContainer').innerHTML=`<div class="p-3 bg-emerald-50 border-2 rounded-xl font-bold">${w} - Tabbatar</div>`;document.getElementById('wardHidden').value=w;}
function buildRegisterWardSelect(){const c=document.getElementById('sWardCustom');if(!c)return;c.innerHTML=`<div class="custom-select"><div onclick="toggleCustomSelect('sWardList')" class="w-full p-4 bg-white border-2 border-emerald-600 rounded-xl text-sm font-bold flex justify-between cursor-pointer"><span id="sWardDisplayText">Danna nan - Zabi Ward</span><span>▼</span></div><div id="sWardList" class="custom-select-list">${bulanguWards.map(w=>`<div class="custom-option" onclick="chooseSWard('${w.ward}')">${w.ward}</div>`).join('')}</div></div><input type="hidden" id="sWardHidden">`;}
function chooseSWard(w){document.getElementById('sWardDisplayText').innerText=w+' Ward';document.getElementById('sWardHidden').value=w;document.getElementById('sWardList').classList.remove('open');}
const menus=[
{title:"1. Tarihin GZ",mTitle:"Waye Hon. Gimba Zago?",mText:"Dan asalin Zago, Bulangu - APC 2027",content:`<h3 class="font-black text-2xl">HON. GIMBA ZAGO</h3><p class="text-sm font-bold text-emerald-700">APC - BULANGU 2027</p><p class="text-sm mt-3">Dan Zago - Bulangu</p>`},
{title:"2. Chat Bulangu LIVE",mTitle:"Chat Room - LIVE - HON. GIMBA ZAGO",mText:"Zabi Ward - Yi chat - Da Hausa - A hankali",content:`<div><label class="text-xs font-black text-emerald-700 mb-2 block">ZABI WARD - Danna don jerin - Yanzu yana aiki:</label><div id="chatWardCustom"></div><div id="chatBox" class="h-[340px] overflow-auto bg-slate-50 rounded-2xl p-4 space-y-3 border-2 mt-4"></div><div class="flex gap-2 mt-4"><input id="chatName" placeholder="Sunanka" class="w-1/3 p-3 border-2 rounded-xl text-sm"><input id="chatMsg" placeholder="Rubuta..." class="flex-1 p-3 border-2 rounded-xl text-sm"><button onclick="sendChat()" class="bg-emerald-700 text-white px-6 py-3 rounded-xl font-black">Tura</button></div></div>`},
{title:"3. Muryar Bulangu Hausa",mTitle:"Muryar Bulangu - Hausa A Hankali",mText:"Magana da Hausa - A hankali - Ba da sauri ba",content:`<div class="text-center"><label class="text-xs font-black text-emerald-700 mb-2 block text-left">ZABI WARD - Danna:</label><div id="lgaCustom"></div><div id="wardSelectContainer" class="mt-3"></div><input type="hidden" id="lgaHidden"><input type="hidden" id="wardHidden"><button id="recBtn" onclick="toggleRec()" class="w-28 h-28 bg-red-600 text-white rounded-full text-4xl mx-auto block mt-6">🎙️</button><p id="recStatus" class="text-xs mt-3 font-bold">Danna - Hausa - A hankali</p><textarea id="voiceText" class="w-full mt-5 p-4 border-2 rounded-2xl text-sm" rows="4" placeholder="Mu a Zago..."></textarea><button onclick="submitVoice()" class="w-full mt-3 bg-emerald-700 text-white py-4 rounded-xl font-black">Tura Muryar</button><div id="voiceList" class="mt-6 space-y-3"></div></div>`},
{title:"4. Wards",mTitle:"Wards 11 - Bulangu",mText:"Duk Wards",content:`<div><input id="wardSearchInner" oninput="filterWardsInner()" placeholder="Nema Ward..." class="w-full p-4 border-2 rounded-xl text-sm mb-4"><div id="wardsGrid" class="grid gap-3"></div></div>`},
{title:"5. Register",mTitle:"Register - GZ",mText:"Zama magoyin baya",content:`<div class="space-y-4"><label class="text-xs font-black text-emerald-700">ZABI WARD:</label><div id="sWardCustom"></div><input id="sName" placeholder="Suna" class="w-full p-4 border-2 rounded-xl text-sm"><input id="sPhone" placeholder="WhatsApp" class="w-full p-4 border-2 rounded-xl text-sm"><button onclick="register()" class="w-full bg-emerald-700 text-white py-4 rounded-xl font-black">Register - GZ</button></div>`},
{title:"6. Manifesto",mTitle:"Me GZ zai yi?",mText:"Manifesto 5",content:`<h3 class="font-black text-xl">Manifesto 5</h3><div class="mt-4 space-y-3 text-sm"><div class="p-4 bg-emerald-50 rounded-xl"><b>1. Ilimi</b></div><div class="p-4 bg-blue-50 rounded-xl"><b>2. Ruwa</b></div><div class="p-4 bg-amber-50 rounded-xl"><b>3. Hanyoyi</b></div><div class="p-4 bg-purple-50 rounded-xl"><b>4. Matasa</b></div><div class="p-4 bg-rose-50 rounded-xl"><b>5. Lafiya</b></div></div>`},
{title:"7. Yada App",mTitle:"Yada App",mText:"Yada a Bulangu",content:`<div class="text-center"><button onclick="shareApp()" class="w-full bg-emerald-700 text-white py-4 rounded-xl font-black">Yada - GZ</button><p class="text-xs mt-2">gimba-zago-bulangu-2027.onrender.com</p></div>`}
];
let current=0; let localSupporters=JSON.parse(localStorage.getItem('gz_supporters')||'[]'); let localVoices=JSON.parse(localStorage.getItem('gz_voices')||'[]');
function renderMenu(){document.getElementById('menuList').innerHTML=menus.map((m,i)=>`<button onclick="selectMenu(${i})" class="w-full text-left px-4 py-3 rounded-xl text-[13px] font-bold ${i===current?'active':'bg-slate-50 border'}">${m.title}</button>`).join('');}
function selectMenu(i){current=i; renderMenu(); document.getElementById('mTitle').innerText=menus[i].mTitle; document.getElementById('mText').innerText=menus[i].mText; document.getElementById('detail').innerHTML=menus[i].content; setTimeout(()=>{if(i===1){buildChatWardSelect(); renderChats();} if(i===2){buildLgaCustomSelect(); renderVoices();} if(i===3){renderWardsGrid(bulanguWards);} if(i===4){buildRegisterWardSelect();}},200);}
function next(){if(current<menus.length-1)selectMenu(current+1);} function prev(){if(current>0)selectMenu(current-1);}
function renderWardsGrid(list){const g=document.getElementById('wardsGrid'); if(!g)return; g.innerHTML=list.map(w=>`<div class="p-4 bg-white border-2 rounded-2xl flex justify-between"><div><p class="font-black text-sm">${w.ward}</p></div><button onclick="selectWardFromGrid('${w.ward}')" class="text-xs bg-emerald-600 text-white px-4 py-2 rounded-full font-bold">Chat</button></div>`).join('');}
function filterWards(){const q=document.getElementById('searchWards').value.toLowerCase(); const f=bulanguWards.filter(w=>w.ward.toLowerCase().includes(q)); selectMenu(3); setTimeout(()=>renderWardsGrid(f),200);} function filterWardsInner(){const q=document.getElementById('wardSearchInner').value.toLowerCase(); renderWardsGrid(bulanguWards.filter(w=>w.ward.toLowerCase().includes(q)));}
function selectWardFromGrid(w){selectMenu(1); setTimeout(()=>{chooseChatWard(w);},300);}
async function register(){const ward=document.getElementById('sWardHidden')?.value||''; const name=document.getElementById('sName').value.trim(); const phone=document.getElementById('sPhone').value.trim(); if(!ward||!name){alert('Zabi Ward da Suna - Danna jerin'); return;} const data={name,ward,phone,createdAt:new Date().toISOString()}; localSupporters.push(data); localStorage.setItem('gz_supporters',JSON.stringify(localSupporters)); document.getElementById('liveCount').innerText=localSupporters.length; document.getElementById('cardBox').classList.remove('hidden'); document.getElementById('cardData').innerHTML=`<p class="font-black text-xl">HON. GIMBA ZAGO</p><p>Suna: ${name}</p><p>Ward: ${ward}</p><p>Founder: Mam Bulangu</p>`; alert('Register - '+ward);}
let rec=false; let recognition; function toggleRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){alert('Chrome kawai'); return;} if(!rec){recognition=new SR(); recognition.lang='ha-NG'; recognition.onstart=()=>{rec=true; document.getElementById('recBtn').innerText='⏹️';}; recognition.onresult=e=>{document.getElementById('voiceText').value=e.results[0][0].transcript;}; recognition.onend=()=>{rec=false; document.getElementById('recBtn').innerText='🎙️';}; recognition.start();} else recognition.stop();}
async function submitVoice(){const txt=document.getElementById('voiceText').value.trim(); const ward=document.getElementById('wardHidden')?.value||'Bulangu'; if(!txt){alert('Rubuta'); return;} const data={text:txt,ward,date:new Date().toISOString()}; localVoices.push(data); localStorage.setItem('gz_voices',JSON.stringify(localVoices)); renderVoices(); alert('Muryar ta je - '+ward);}
function renderVoices(){const b=document.getElementById('voiceList'); if(!b)return; b.innerHTML=localVoices.slice(-6).reverse().map(v=>`<div class="p-4 bg-white border rounded-2xl text-sm"><p>"${v.text}"</p><p class="text-[11px] text-slate-400">${v.ward}</p></div>`).join('');}
async function sendChat(){const ward=document.getElementById('chatWardHidden')?.value||selectedChatWard; const name=document.getElementById('chatName').value.trim()||'Dan Bulangu'; const msg=document.getElementById('chatMsg').value.trim(); if(!ward||!msg){alert('Zabi Ward - Danna jerin - Rubuta sako'); return;} let chats=JSON.parse(localStorage.getItem('gz_chats')||'[]'); chats.push({ward,name,msg,createdAt:new Date().toISOString()}); localStorage.setItem('gz_chats',JSON.stringify(chats)); document.getElementById('chatMsg').value=''; renderChats();}
function renderChats(){const box=document.getElementById('chatBox'); if(!box)return; const ward=document.getElementById('chatWardHidden')?.value||selectedChatWard; let list=JSON.parse(localStorage.getItem('gz_chats')||'[]'); if(ward)list=list.filter(c=>c.ward===ward); list=list.slice(-25); box.innerHTML=list.map(c=>`<div class="flex"><div class="p-3 bg-white border rounded-2xl text-sm"><p class="font-black text-[11px] text-emerald-700">${c.name} - ${c.ward}</p><p>${c.msg}</p></div></div>`).join('')||`<p class="text-sm text-slate-400 text-center py-8">Babu sakonni a ${ward||'Ward'} - Ka fara!</p>`; box.scrollTop=box.scrollHeight;}
function shareApp(){const url='https://gimba-zago-bulangu-2027.onrender.com'; navigator.clipboard.writeText(url); alert('Link an kwafa: '+url);}
function openLogin(){document.getElementById('loginModal').classList.remove('hidden');} function closeLogin(){document.getElementById('loginModal').classList.add('hidden');}
function doLogin(){closeLogin(); alert('An shiga - HON. GIMBA ZAGO');}
renderMenu(); selectMenu(0);
</script>
</body>
</html>
